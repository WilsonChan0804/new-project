<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LWK Viewer - Folders</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dash.css">
<link rel="stylesheet" href="tasks.css">
<link rel="stylesheet" href="folders.css">
<link rel="modulepreload" href="folders.js">
<link rel="modulepreload" href="nav.js">
<link rel="modulepreload" href="pagekit.js">
<link rel="modulepreload" href="tasks-util.js">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f28022">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
</head>
<body class="tasks-page fo-page own-nav">
<header>
  <b class="brand"><img class="brand-logo" src="icons/logo-white.png" alt="LWK + Partners"><span class="brand-app">Viewer</span></b>
  <div class="seg">
    <a id="to-projects" class="seg-btn" data-page="projects.html" href="projects.html">Projects</a>
    <a id="to-sheets" class="seg-btn" data-page="index.html" href="index.html">Sheets</a>
    <a id="to-3d" class="seg-btn" data-page="model.html" href="model.html">3D</a>
    <a id="to-board" class="seg-btn" data-page="board.html" href="board.html">Board</a>
    <a id="to-tasks" class="seg-btn" data-page="tasks.html" href="tasks.html">Tasks</a>
    <a id="to-chat" class="seg-btn chat-link" data-page="messenger.html" href="messenger.html">Chat</a>
    <a id="to-cal" class="seg-btn" data-page="calendar.html" href="calendar.html">Calendar</a>
    <span class="seg-btn on">Folders</span>
    <a id="to-dash" class="seg-btn" data-page="dashboard.html" href="dashboard.html">Dashboard</a>
  </div>
  <span class="spacer"></span>
  <div id="lwk-nav">
    <a id="to-admin" href="admin.html" hidden>Admin</a>
    <span class="who" id="h-who"></span>
    <a href="#" id="h-signout" hidden>Sign out</a>
  </div>
</header>

<main id="fo">
  <aside id="fo-side">
    <select id="fo-proj" title="Project"></select>
    <nav class="fo-quick">
      <button data-q="pinned">&#128204; Pinned <small id="fo-n-pinned"></small></button>
      <button data-q="starred">&#11088; Starred <small id="fo-n-starred"></small></button>
      <button data-q="recent">&#128337; Recent</button>
      <button data-q="bin">&#128465; Recently deleted</button>
    </nav>
    <div class="fo-treehead">Folders</div>
    <div id="fo-tree"></div>
  </aside>
  <section id="fo-main">
    <div class="fo-bar">
      <button class="ghost fo-sidebtn" id="fo-side-open" title="Show or hide the folders">&#9776;</button>
      <div id="fo-crumbs"></div>
      <span class="spacer"></span>
      <input id="fo-search" type="search" placeholder="Search this project's files">
      <button class="ghost" id="fo-newdir" title="New folder">+ Folder</button>
      <button class="primary" id="fo-up" title="Upload files (or drop them here)">Upload</button>
      <button class="ghost" id="fo-more" title="Templates, location">&#8943;</button>
      <input type="file" id="fo-file" multiple hidden>
      <input type="file" id="fo-dir" webkitdirectory multiple hidden>
    </div>
    <div id="fo-list" tabindex="0"></div>
    <div id="fo-drop" hidden><div>Drop to upload into <b id="fo-drop-to"></b></div></div>
  </section>
  <aside id="fo-prev" hidden></aside>
</main>
<div id="fo-prog" hidden></div>
<div id="gate-back" hidden>
  <form id="gate" onsubmit="return false">
    <b>Sign in</b>
    <label>Email<input id="gate-name" type="email" autocomplete="username"></label>
    <label>Password<input id="gate-pass" type="password" autocomplete="current-password"></label>
    <p id="gate-msg" class="muted" style="font-size:11px"></p>
    <div class="row end"><button id="gate-go">Sign in</button></div>
  </form>
</div>

<script type="module" src="folders.js"></script>
</body>
</html>
