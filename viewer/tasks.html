<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LWK Viewer - Tasks</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dash.css">
<link rel="stylesheet" href="tasks.css">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f28022">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
</head>
<body class="tasks-page own-nav">
<header>
  <b class="brand"><img class="brand-logo" src="icons/logo-white.png" alt="LWK + Partners"><span class="brand-app">Viewer</span></b>
  <div class="seg">
    <a id="to-projects" class="seg-btn" data-page="projects.html" href="projects.html">Projects</a>
    <a id="to-sheets" class="seg-btn" data-page="index.html" href="index.html">Sheets</a>
    <a id="to-3d" class="seg-btn" data-page="model.html" href="model.html">3D</a>
    <a id="to-board" class="seg-btn" data-page="board.html" href="board.html">Board</a>
    <span class="seg-btn on">Tasks</span>
    <a id="to-chat" class="seg-btn chat-link" data-page="messenger.html" href="messenger.html">Chat</a>
    <a id="to-cal" class="seg-btn" data-page="calendar.html" href="calendar.html">Calendar</a>
    <a id="to-folders" class="seg-btn" data-page="folders.html" href="folders.html">Folders</a>
    <a id="to-dash" class="seg-btn" data-page="dashboard.html" href="dashboard.html">Dashboard</a>
  </div>
  <span class="spacer"></span>
  <div id="lwk-nav">
    <a id="to-admin" href="admin.html" hidden>Admin</a>
    <span class="who" id="t-who"></span>
    <a href="#" id="t-signout" hidden>Sign out</a>
  </div>
</header>

<div id="t-app">
  <aside id="t-side">
    <button id="t-side-toggle" class="ghost" title="Hide or show the side bar">&#9776;</button>
    <div class="ts-sec">
      <a class="ts-item" data-quick="owned"><span class="ts-i">&#128100;</span>Owned <b class="ts-n" id="n-owned"></b></a>
      <a class="ts-item" data-quick="subscribed"><span class="ts-i">&#128278;</span>Subscribed</a>
      <a class="ts-item" data-mode="activity"><span class="ts-i">&#128337;</span>Activities</a>
    </div>
    <div class="ts-sec">
      <div class="ts-h">Quick access</div>
      <a class="ts-item sub" data-quick="all">All tasks</a>
      <a class="ts-item sub" data-quick="created">Created</a>
      <a class="ts-item sub" data-quick="assigned">Assigned</a>
      <a class="ts-item sub" data-quick="completed">Completed</a>
    </div>
    <div class="ts-sec">
      <div class="ts-h">Task lists <button id="t-newlist" class="ghost ts-plus" title="Start a new task list">+</button></div>
      <div id="t-lists"></div>
    </div>
    <div class="ts-sec">
      <a class="ts-item" data-mode="people"><span class="ts-i">&#128101;</span>People</a>
    </div>
  </aside>

  <main id="t-main">
    <div id="t-head">
      <div class="th-title">
        <button id="t-side-open" class="ghost" title="Lists and quick access"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
        <span class="th-icon">&#9745;</span>
        <h2 id="t-title">Tasks</h2>
        <small id="t-team" class="muted"></small>
        <button id="t-menu" class="ghost" title="List settings" hidden>&#8943;</button>
      </div>
      <nav id="t-tabs" hidden>
        <button data-view="list" class="on">List</button>
        <button data-view="kanban">Kanban</button>
        <button data-view="gantt">Gantt</button>
        <button data-view="dash">Dashboard</button>
        <button data-view="activity">Activities</button>
      </nav>
      <span class="spacer"></span>
      <div id="t-members" title="People on this list"></div>
      <button id="t-share" hidden title="Who can see and edit this list">Members</button>
    </div>

    <div id="t-bar" hidden>
      <span class="tb-new"><button id="t-new" class="primary">+ New task</button><button id="t-new-more" class="primary" title="More">&#9662;</button></span>
      <input id="f-q" type="search" placeholder="Search tasks" autocomplete="off">
      <select id="f-status" title="Which tasks">
        <option value="all">All tasks</option>
        <option value="open">Not done</option>
        <option value="done">Done</option>
        <option value="overdue">Overdue</option>
        <option value="mine">Mine</option>
      </select>
      <select id="f-owner" title="Owner"><option value="">Any owner</option></select>
      <select id="f-pri" title="Priority"><option value="">Any priority</option><option>Urgent</option><option>High</option><option>Medium</option><option>Low</option></select>
      <label class="tb-l">Sort <select id="f-sort">
        <option value="custom">Custom</option><option value="due">Due date</option><option value="start">Start date</option>
        <option value="priority">Priority</option><option value="title">Title</option><option value="created">Newest</option>
      </select></label>
      <label class="tb-l">Group by <select id="f-group">
        <option value="group">Custom group</option><option value="owner">Owner</option><option value="priority">Priority</option>
        <option value="status">Status</option><option value="due">Due</option>
      </select></label>
      <button id="t-cols" class="ghost" title="Columns and custom fields">Customize</button>
      <span class="spacer"></span>
      <span id="t-save" class="muted"></span>
    </div>

    <div id="t-view"><div class="lwk-skel-wrap" role="status" aria-label="Loading"><div class="lwk-skel-row"><span class="lwk-skel dot"></span><span class="lwk-skel" style="width:62%"></span><span class="lwk-skel" style="width:10%;margin-left:auto"></span></div><div class="lwk-skel-row"><span class="lwk-skel dot"></span><span class="lwk-skel" style="width:44%"></span><span class="lwk-skel" style="width:17%;margin-left:auto"></span></div><div class="lwk-skel-row"><span class="lwk-skel dot"></span><span class="lwk-skel" style="width:78%"></span><span class="lwk-skel" style="width:10%;margin-left:auto"></span></div><div class="lwk-skel-row"><span class="lwk-skel dot"></span><span class="lwk-skel" style="width:55%"></span><span class="lwk-skel" style="width:17%;margin-left:auto"></span></div><div class="lwk-skel-row"><span class="lwk-skel dot"></span><span class="lwk-skel" style="width:70%"></span><span class="lwk-skel" style="width:10%;margin-left:auto"></span></div><div class="lwk-skel-row"><span class="lwk-skel dot"></span><span class="lwk-skel" style="width:38%"></span><span class="lwk-skel" style="width:17%;margin-left:auto"></span></div></div></div>
  </main>

  <aside id="t-detail" hidden></aside>
</div>

<div id="gate-back" hidden>
  <form id="gate" onsubmit="return false">
    <b>Sign in</b>
    <label>Email<input id="gate-name" type="email" autocomplete="username"></label>
    <label>Password<input id="gate-pass" type="password" autocomplete="current-password"></label>
    <p id="gate-msg" class="muted" style="font-size:11px"></p>
    <div class="row end"><button id="gate-go">Sign in</button></div>
  </form>
</div>

<script type="module" src="tasks.js"></script>
</body>
</html>
