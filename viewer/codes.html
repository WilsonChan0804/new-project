<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LWK Viewer - Codes</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dash.css">
<link rel="stylesheet" href="tasks.css">
<link rel="stylesheet" href="codes.css">
<link rel="stylesheet" href="shell.css">
<link rel="modulepreload" href="codes.js">
<link rel="modulepreload" href="nav.js">
<link rel="modulepreload" href="pagekit.js">
<link rel="modulepreload" href="tasks-util.js">
<link rel="modulepreload" href="gbp.js">
<link rel="modulepreload" href="gbpcore.js">
<link rel="modulepreload" href="gbptables.js">
<link rel="modulepreload" href="gbpmodel.js">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f28022">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
</head>
<body class="tasks-page codes-page own-nav">
<header>
  <b class="brand"><img class="brand-logo" src="icons/logo-white.png" alt="LWK + Partners"><span class="brand-app">Viewer</span></b>
  <div class="seg">
    <a id="to-projects" class="seg-btn" data-page="projects.html" href="projects.html">Projects</a>
    <a id="to-sheets" class="seg-btn" data-page="index.html" href="index.html">Sheets</a>
    <a id="to-3d" class="seg-btn" data-page="model.html" href="model.html">3D</a>
    <a id="to-board" class="seg-btn" data-page="board.html" href="board.html">Board</a>
    <a id="to-tasks" class="seg-btn" data-page="tasks.html" href="tasks.html">Tasks</a>
    <a id="to-chat" class="seg-btn chat-link" data-page="messenger.html" href="messenger.html">Chat</a>
    <a id="to-cal" class="seg-btn" data-page="calendar.html" href="calendar.html">Calendar</a>
    <a id="to-folders" class="seg-btn" data-page="folders.html" href="folders.html">Folders</a>
    <span class="seg-btn on">Codes</span>
    <a id="to-dash" class="seg-btn" data-page="dashboard.html" href="dashboard.html">Dashboard</a>
  </div>
  <span class="spacer"></span>
  <div id="lwk-nav">
    <a id="to-admin" href="admin.html" hidden>Admin</a>
    <span class="who" id="h-who"></span>
    <a href="#" id="h-signout" hidden>Sign out</a>
  </div>
</header>

<nav class="cx-tabs" role="tablist">
  <button type="button" class="cx-tab on" data-tab="kb" role="tab" title="The office's summaries - Ordinance, regulations, Codes of Practice, PNAPs, APSEC, topic guides - with the search beside them">Knowledge base</button>
  <button type="button" class="cx-tab" data-tab="lib" role="tab" title="The official documents: their clauses are searched; Find documents on the BD site">Library</button>
  <button type="button" class="cx-tab" data-tab="gbp" role="tab" title="The GBP calculations of this project: PR, SC, GFA and concessions, occupancy, exits, staircase discharge">GBP workbook</button>
</nav>
<main id="gbptab" hidden><div id="gbp"></div></main>
<main id="kbtab">
  <div class="kb-bar">
    <button type="button" class="ghost" id="kb-back" title="Back">&lsaquo;</button><button type="button" class="ghost" id="kb-home" title="The knowledge base's home page">Home</button>
    <form id="cx-form" class="kb-sform" onsubmit="return false" role="search">
      <input id="cx-q" type="search" autocomplete="off" placeholder="Search the codes and the summaries ... e.g. dead end travel distance, TRS 要求  ( / )">
      <button type="submit" class="primary" id="cx-search" title="Find the summaries, Quick facts, diagrams and clauses">Search</button>
    </form>
    <span class="spacer"></span>
    <span class="muted kb-ver" id="kb-ver"></span>
    <button type="button" class="ghost" id="kb-ptog" title="Show or hide the search results and the workbook beside the page">Results &#9656;</button>
    <button type="button" class="ghost" id="kb-open" title="Open this page in a window of its own">&#8599;</button>
  </div>
  <div class="kb-split">
    <div class="kb-left">
      <div class="kb-empty" id="kb-empty" hidden></div>
      <iframe id="kb-frame" title="Knowledge base" hidden></iframe>
    </div>
    <aside id="kb-panel" hidden>
      <div class="kbp-h">
        <div class="kbp-tabs"><button type="button" class="on" data-pv="search">Search</button><button type="button" data-pv="gbp" title="This project's GBP workbook, beside the guide">GBP workbook</button></div>
        <span class="spacer"></span>
        <span id="cx-state" class="muted"></span>
        <button class="ghost" id="cx-recent" type="button" title="Your last searches">Recent &#9662;</button>
        <button class="ghost" id="cx-new" type="button" title="Clear the searches">New</button>
        <button class="ghost kbp-x" id="kb-px" type="button" title="Close">&times;</button>
      </div>
      <div id="kbp-search">
        <div id="cx-log" aria-live="polite"></div>
        <section id="cx-side">
          <div class="cx-side-h"><button class="ghost" id="cx-side-x" type="button" title="Back to the results">&lsaquo; Results</button><b id="cx-side-title">Clauses</b></div>
          <div id="cx-clauses"></div>
        </section>
      </div>
      <div id="kbp-gbp" hidden></div>
    </aside>
  </div>
  <button type="button" class="kb-fab" id="kb-fab" title="Search" aria-label="Search">&#128269;</button>
</main>
<main id="libtab" hidden><div id="cx-libpage"></div></main>
<div id="gate-back" hidden>
  <form id="gate" onsubmit="return false">
    <b>Sign in</b>
    <label>Email<input id="gate-name" type="email" autocomplete="username"></label>
    <label>Password<input id="gate-pass" type="password" autocomplete="current-password"></label>
    <p id="gate-msg" class="muted" style="font-size:11px"></p>
    <div class="row end"><button id="gate-go">Sign in</button></div>
  </form>
</div>

<script type="module" src="codes.js"></script>
</body>
</html>
