<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LWK Viewer - Projects</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dash.css">
<link rel="stylesheet" href="tasks.css">
<link rel="stylesheet" href="projects.css">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f28022">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
</head>
<body class="tasks-page projects-page own-nav">
<header>
  <b class="brand"><img class="brand-logo" src="icons/logo-white.png" alt="LWK + Partners"><span class="brand-app">Viewer</span></b>
  <div class="seg">
    <span class="seg-btn on">Projects</span>
    <a id="to-sheets" class="seg-btn" data-page="index.html" href="index.html">Sheets</a>
    <a id="to-3d" class="seg-btn" data-page="model.html" href="model.html">3D</a>
    <a id="to-board" class="seg-btn" data-page="board.html" href="board.html">Board</a>
    <a id="to-tasks" class="seg-btn" data-page="tasks.html" href="tasks.html">Tasks</a>
    <a id="to-chat" class="seg-btn chat-link" data-page="messenger.html" href="messenger.html">Chat</a>
    <a id="to-cal" class="seg-btn" data-page="calendar.html" href="calendar.html">Calendar</a>
    <a id="to-folders" class="seg-btn" data-page="folders.html" href="folders.html">Folders</a>
    <a id="to-dash" class="seg-btn" data-page="dashboard.html" href="dashboard.html">Dashboard</a>
  </div>
  <span class="spacer"></span>
  <div id="lwk-nav">
    <a id="to-admin" href="admin.html" hidden>Admin</a>
    <span class="who" id="h-who"></span>
    <a href="#" id="h-signout" hidden>Sign out</a>
  </div>
</header>

<div id="t-app">
  <main id="t-main">
    <div id="t-head">
      <div class="th-title"><span class="th-icon">&#9873;</span><h2>Projects</h2>
        <small class="muted" id="pj-count"></small></div>
      <span class="spacer"></span>
    </div>
    <div id="t-bar">
      <input id="pj-q" type="search" placeholder="Search projects or people" autocomplete="off">
      <select id="pj-status"><option value="">Any status</option></select>
      <select id="pj-sort" title="Order of the list">
        <option value="status:1">Sort: status, then name</option>
        <option value="name:1">Sort: name A-Z</option>
        <option value="name:-1">Sort: name Z-A</option>
        <option value="code:1">Sort: project number</option>
        <option value="overdue:-1">Sort: most overdue</option>
        <option value="issues:-1">Sort: most open issues</option>
        <option value="done:-1">Sort: most complete</option>
      </select>
      <span class="spacer"></span>
      <a id="pj-manage" class="ghost" href="admin.html#projects" hidden style="font-size:12px" title="Add projects, set their members and link their viewer project">Manage projects (Admin)</a>
    </div>
    <div id="t-view"><div class="lwk-skel-wrap" role="status" aria-label="Loading"><div class="lwk-skel-row"><span class="lwk-skel dot"></span><span class="lwk-skel" style="width:62%"></span><span class="lwk-skel" style="width:10%;margin-left:auto"></span></div><div class="lwk-skel-row"><span class="lwk-skel dot"></span><span class="lwk-skel" style="width:44%"></span><span class="lwk-skel" style="width:17%;margin-left:auto"></span></div><div class="lwk-skel-row"><span class="lwk-skel dot"></span><span class="lwk-skel" style="width:78%"></span><span class="lwk-skel" style="width:10%;margin-left:auto"></span></div><div class="lwk-skel-row"><span class="lwk-skel dot"></span><span class="lwk-skel" style="width:55%"></span><span class="lwk-skel" style="width:17%;margin-left:auto"></span></div><div class="lwk-skel-row"><span class="lwk-skel dot"></span><span class="lwk-skel" style="width:70%"></span><span class="lwk-skel" style="width:10%;margin-left:auto"></span></div><div class="lwk-skel-row"><span class="lwk-skel dot"></span><span class="lwk-skel" style="width:38%"></span><span class="lwk-skel" style="width:17%;margin-left:auto"></span></div></div></div>
  </main>
  <aside id="t-detail" hidden></aside>
</div>

<div id="gate-back" hidden>
  <form id="gate" onsubmit="return false">
    <b>Sign in</b>
    <label>Email<input id="gate-name" type="email" autocomplete="username"></label>
    <label>Password<input id="gate-pass" type="password" autocomplete="current-password"></label>
    <p id="gate-msg" class="muted" style="font-size:11px"></p>
    <div class="row end"><button id="gate-go">Sign in</button></div>
  </form>
</div>

<script type="module" src="projects-page.js"></script>
</body>
</html>
