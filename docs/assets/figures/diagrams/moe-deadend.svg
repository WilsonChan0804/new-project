<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,PingFang TC,Microsoft JhengHei,Noto Sans CJK TC,sans-serif" font-size="13" fill="#3B2A1F"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B34A22"/></marker></defs><rect width="760" height="310" fill="#fff"/><text x="380" y="26" font-size="15" text-anchor="middle" font-weight="bold" fill="#3B2A1F">Means of escape: dead end vs two directions 盡頭路與雙向逃生</text><rect x="30" y="60" width="330" height="200" fill="#fff" stroke="#78716C" stroke-width="1" /><text x="195" y="50" font-size="13" text-anchor="middle" font-weight="bold" fill="#B34A22">Dead end 盡頭路</text><rect x="50" y="80" width="110" height="80" fill="#FFF1E6" stroke="#F08020" stroke-width="1.5" /><text x="105" y="125" font-size="13" text-anchor="middle" font-weight="normal" fill="#3B2A1F">Room 房間</text><rect x="50" y="175" width="290" height="30" fill="#E7E5E4" stroke="#78716C" stroke-width="1" /><text x="250" y="195" font-size="11" text-anchor="middle" font-weight="normal" fill="#78716C">corridor 走廊</text><rect x="300" y="215" width="40" height="40" fill="#FDE3CC" stroke="#B34A22" stroke-width="1.5" /><text x="320" y="240" font-size="11" text-anchor="middle" font-weight="normal" fill="#3B2A1F">Exit</text><polyline points="105,160 105,190 320,190 320,215" fill="none" stroke="#B34A22" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="195" y="280" font-size="12" text-anchor="middle" font-weight="normal" fill="#B34A22">one direction only: ≤ 18 m to exit or to the point</text><text x="195" y="296" font-size="12" text-anchor="middle" font-weight="normal" fill="#B34A22">where two directions are available 單向 ≤ 18 米</text><rect x="400" y="60" width="330" height="200" fill="#fff" stroke="#78716C" stroke-width="1" /><text x="565" y="50" font-size="13" text-anchor="middle" font-weight="bold" fill="#B34A22">Two directions 雙向</text><rect x="420" y="175" width="290" height="30" fill="#E7E5E4" stroke="#78716C" stroke-width="1" /><rect x="510" y="80" width="110" height="80" fill="#FFF1E6" stroke="#F08020" stroke-width="1.5" /><text x="565" y="125" font-size="13" text-anchor="middle" font-weight="normal" fill="#3B2A1F">Room 房間</text><rect x="410" y="215" width="40" height="40" fill="#FDE3CC" stroke="#B34A22" stroke-width="1.5" /><text x="430" y="240" font-size="11" text-anchor="middle" font-weight="normal" fill="#3B2A1F">Exit</text><rect x="670" y="215" width="40" height="40" fill="#FDE3CC" stroke="#B34A22" stroke-width="1.5" /><text x="690" y="240" font-size="11" text-anchor="middle" font-weight="normal" fill="#3B2A1F">Exit</text><polyline points="565,160 565,190 430,190 430,215" fill="none" stroke="#B34A22" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/><polyline points="565,190 690,190 690,215" fill="none" stroke="#B34A22" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="565" y="280" font-size="12" text-anchor="middle" font-weight="normal" fill="#B34A22">normal direct / travel distance limits</text><text x="565" y="296" font-size="12" text-anchor="middle" font-weight="normal" fill="#B34A22">of Table B (FS Code B11) 一般距離限制</text></svg>