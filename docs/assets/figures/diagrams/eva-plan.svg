<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" width="760" height="365" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,PingFang TC,Microsoft JhengHei,Noto Sans CJK TC,sans-serif" font-size="13" fill="#3B2A1F"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B34A22"/></marker></defs><rect width="760" height="365" fill="#fff"/><text x="380" y="26" font-size="15" text-anchor="middle" font-weight="bold" fill="#3B2A1F">Emergency vehicular access (EVA), plan 緊急車輛通道平面</text><rect x="260" y="70" width="240" height="150" fill="#FFF1E6" stroke="#F08020" stroke-width="2" /><text x="380" y="150" font-size="14" text-anchor="middle" font-weight="bold" fill="#B34A22">BUILDING 建築物</text><rect x="150" y="250" width="460" height="50" fill="#E7E5E4" stroke="#78716C" stroke-width="1" /><text x="380" y="280" font-size="12" text-anchor="middle" font-weight="bold" fill="#3B2A1F">EVA ≥ 7.3 m carriageway (or ≥ 6 m hard-paved) 車路</text><line x1="560" y1="220" x2="560" y2="250" stroke="#B34A22" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="560.0" y="229.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#B34A22"></text><text x="600" y="240" font-size="12" text-anchor="middle" font-weight="bold" fill="#B34A22">≤ 10 m</text><line x1="260" y1="226" x2="500" y2="226" stroke="#F08020" stroke-width="5"/><text x="380" y="244" font-size="11" text-anchor="middle" font-weight="normal" fill="#B34A22">serves ≥ ¼ of building perimeter 服務 ≥ ¼ 周界</text><text x="380" y="330" font-size="12" text-anchor="middle" font-weight="normal" fill="#78716C">Headroom ≥ 4.5 m · gradient ≤ 1 : 10 · design vehicle 30 t, 12 m, 26 m turning circle 淨空 4.5 米、坡度 1:10</text><text x="380" y="348" font-size="12" text-anchor="middle" font-weight="normal" fill="#78716C">Industrial buildings: EVA to two opposite façades 工業建築物須兩個相對立面 (FS Code Part D)</text></svg>