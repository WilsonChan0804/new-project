<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,PingFang TC,Microsoft JhengHei,Noto Sans CJK TC,sans-serif" font-size="13" fill="#3B2A1F"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B34A22"/></marker></defs><rect width="760" height="320" fill="#fff"/><text x="380" y="26" font-size="15" text-anchor="middle" font-weight="bold" fill="#3B2A1F">ELS plans: the 45° zone of influence 挖掘及側向承托：45° 影響範圍</text><line x1="30" y1="90" x2="730" y2="90" stroke="#78716C" stroke-width="2"/><path d="M260,90 L260,250 L500,250 L500,90" fill="#FFF8F1" stroke="#F08020" stroke-width="2"/><text x="380" y="180" font-size="13" text-anchor="middle" font-weight="bold" fill="#B34A22">Excavation 挖掘</text><line x1="240" y1="90" x2="240" y2="250" stroke="#B34A22" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="240.0" y="164.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#B34A22"></text><text x="205" y="175" font-size="12" text-anchor="middle" font-weight="bold" fill="#B34A22">> 2.5 m</text><line x1="260" y1="270" x2="500" y2="270" stroke="#B34A22" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="380.0" y="286.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#B34A22">> 5 m long 長</text><line x1="500" y1="250" x2="660" y2="90" stroke="#B34A22" stroke-width="1.5" stroke-dasharray="6 4"/><text x="615" y="185" font-size="13" text-anchor="middle" font-weight="bold" fill="#B34A22">45°</text><line x1="260" y1="250" x2="100" y2="90" stroke="#B34A22" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="500,90 660,90 500,250" fill="#F08020" fill-opacity="0.12"/><polygon points="260,90 100,90 260,250" fill="#F08020" fill-opacity="0.12"/><rect x="560" y="40" width="80" height="50" fill="#E7E5E4" stroke="#78716C" stroke-width="1" /><text x="600" y="70" font-size="11" text-anchor="middle" font-weight="normal" fill="#3B2A1F">building</text><rect x="110" y="74" width="110" height="16" fill="#D6D3D1" stroke="#78716C" stroke-width="1" /><text x="165" y="68" font-size="11" text-anchor="middle" font-weight="normal" fill="#3B2A1F">road 道路</text><circle cx="560" cy="115" r="7" fill="#DBEAFE" stroke="#78716C"/><text x="640" y="120" font-size="11" text-anchor="start" font-weight="normal" fill="#3B2A1F">water main ≥ 75 mm</text><text x="380" y="305" font-size="12" text-anchor="middle" font-weight="normal" fill="#78716C">If a road, building, structure, slope > 30° or water main ≥ 75 mm lies within the 45° zone → ELS plans (RSE); > 4.5 m deep → RGE too</text></svg>