<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 335" width="760" height="335" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,PingFang TC,Microsoft JhengHei,Noto Sans CJK TC,sans-serif" font-size="13" fill="#3B2A1F"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B34A22"/></marker></defs><rect width="760" height="335" fill="#fff"/><text x="380" y="26" font-size="15" text-anchor="middle" font-weight="bold" fill="#3B2A1F">Vertical fire separation between floors 樓層之間的垂直防火分隔</text><text x="170" y="54" font-size="13" text-anchor="middle" font-weight="bold" fill="#B34A22">Option 1: spandrel 窗間牆</text><line x1="120" y1="70" x2="120" y2="300" stroke="#78716C" stroke-width="2"/><rect x="120" y="120" width="150" height="12" fill="#D6D3D1" stroke="#78716C" stroke-width="1" /><rect x="120" y="230" width="150" height="12" fill="#D6D3D1" stroke="#78716C" stroke-width="1" /><rect x="100" y="80" width="20" height="40" fill="#DBEAFE" stroke="#78716C" stroke-width="1" /><rect x="100" y="190" width="20" height="40" fill="#DBEAFE" stroke="#78716C" stroke-width="1" /><rect x="104" y="120" width="16" height="70" fill="#FDE3CC" stroke="#B34A22" stroke-width="1.5" /><line x1="85" y1="120" x2="85" y2="190" stroke="#B34A22" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="85.0" y="149.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#B34A22"></text><text x="185" y="165" font-size="12" text-anchor="middle" font-weight="bold" fill="#B34A22">≥ 900 mm spandrel</text><text x="185" y="181" font-size="11" text-anchor="middle" font-weight="normal" fill="#78716C">窗間牆 (wall, FRR)</text><text x="530" y="54" font-size="13" text-anchor="middle" font-weight="bold" fill="#B34A22">Option 2: projection 水平伸建物</text><line x1="480" y1="70" x2="480" y2="300" stroke="#78716C" stroke-width="2"/><rect x="480" y="120" width="150" height="12" fill="#D6D3D1" stroke="#78716C" stroke-width="1" /><rect x="480" y="230" width="150" height="12" fill="#D6D3D1" stroke="#78716C" stroke-width="1" /><rect x="460" y="80" width="20" height="40" fill="#DBEAFE" stroke="#78716C" stroke-width="1" /><rect x="460" y="190" width="20" height="40" fill="#DBEAFE" stroke="#78716C" stroke-width="1" /><rect x="480" y="120" width="1" height="1" fill="#FFF1E6" stroke="#F08020" stroke-width="1.5" /><rect x="420" y="128" width="60" height="10" fill="#FDE3CC" stroke="#B34A22" stroke-width="1.5" /><line x1="420" y1="150" x2="480" y2="150" stroke="#B34A22" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="450.0" y="144.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#B34A22"></text><text x="595" y="158" font-size="12" text-anchor="middle" font-weight="bold" fill="#B34A22">≥ 500 mm projection</text><text x="595" y="174" font-size="11" text-anchor="middle" font-weight="normal" fill="#78716C">(FS Code) 伸建物</text><text x="595" y="196" font-size="11" text-anchor="middle" font-weight="normal" fill="#78716C">1996 FRC Code: 900 mm apron</text><text x="595" y="211" font-size="11" text-anchor="middle" font-weight="normal" fill="#78716C">(APP-123) 舊守則 900 毫米簷板</text><text x="380" y="320" font-size="12" text-anchor="middle" font-weight="normal" fill="#78716C">Not needed where the building is sprinklered (FS Code C11); check Part C for FRR and balcony exceptions. 設花灑者毋須設置。</text></svg>