<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投資決策引擎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEFF3; --card:#FFFFFF; --ink:#16202E; --muted:#62717F;
    --rule:#D6DBE2; --indigo:#2F4468;
    --pos:#2E7D6B; --neg:#A8483F; --caut:#B0762A; --none:#9AA5B1;
    --r:10px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:400 16px/1.6 Inter,'Noto Sans HK',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:32px 20px 96px}

  /* ---- header ---- */
  header{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:28px}
  h1{font:800 26px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0;flex:1 1 200px}
  h1 small{display:block;font:500 12px/1.5 'IBM Plex Mono',monospace;
    letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  input,select,button{
    font:500 14px Inter,sans-serif;border:1px solid var(--rule);
    border-radius:var(--r);padding:10px 12px;background:var(--card);color:var(--ink)}
  input{width:110px;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em}
  button{background:var(--indigo);color:#fff;border-color:var(--indigo);cursor:pointer;padding:10px 18px}
  button:hover{background:#243651}
  button:disabled{opacity:.5;cursor:wait}
  :focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

  /* ---- cards ---- */
  .card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
    padding:22px 24px;margin-bottom:16px}
  .eyebrow{font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin:0 0 14px}
  h2{font:700 17px/1.3 Archivo,sans-serif;margin:0 0 4px;letter-spacing:-.01em}

  /* ---- verdict ---- */
  .verdict{font:800 clamp(30px,6vw,46px)/1 Archivo,sans-serif;
    letter-spacing:-.03em;margin:0 0 12px}
  .tone-positive{color:var(--pos)} .tone-negative{color:var(--neg)}
  .tone-neutral{color:var(--caut)} .tone-unknown{color:var(--none)}
  .lede{font-size:17px;margin:0 0 10px;max-width:60ch}
  .sub{color:var(--muted);font-size:14.5px;margin:0;max-width:62ch}

  /* ---- SIGNATURE: the evidence rail ---- */
  .rail{display:flex;height:46px;border-radius:6px;overflow:hidden;
    border:1px solid var(--rule);margin:4px 0 12px}
  .seg{position:relative;transition:opacity .2s}
  .seg span{position:absolute;inset:auto 0 5px;text-align:center;
    font:500 9px/1 'IBM Plex Mono',monospace;letter-spacing:.04em;
    color:#fff;opacity:.85;overflow:hidden;white-space:nowrap;padding:0 2px}
  .seg.missing{background:
    repeating-linear-gradient(135deg,#E4E8ED 0 5px,#CFD6DE 5px 10px)}
  .seg.missing span{color:var(--muted)}
  .rail-note{font-size:13.5px;color:var(--muted);margin:0}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font:500 11px 'IBM Plex Mono',monospace;
    letter-spacing:.05em;color:var(--muted);margin:12px 0 0}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;
    margin-right:5px;vertical-align:-1px}

  /* ---- component rows ---- */
  .row{display:grid;grid-template-columns:1fr 132px;gap:14px;align-items:center;
    padding:13px 0;border-top:1px solid var(--rule)}
  .row:first-of-type{border-top:0}
  .row h3{font:600 15px Inter,sans-serif;margin:0 0 1px}
  .row p{margin:0;font-size:13.5px;color:var(--muted);max-width:52ch}
  .meter{position:relative;height:7px;background:#E7EBF0;border-radius:4px;overflow:hidden}
  .meter i{position:absolute;inset:0 auto 0 0;border-radius:4px;
    width:0;transition:width .7s cubic-bezier(.2,.7,.3,1)}
  .subs{margin-top:8px!important;display:flex;flex-wrap:wrap;gap:6px}
  .subs span{font:500 11px 'IBM Plex Mono',monospace;background:#F2F5F8;
    border:1px solid var(--rule);border-radius:20px;padding:3px 9px;color:var(--muted)}
  .subs b{color:var(--ink);font-weight:500}
  .subs i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
  .meter.na{background:repeating-linear-gradient(135deg,#E4E8ED 0 4px,#CFD6DE 4px 8px)}
  .val{font:500 12px/1.4 'IBM Plex Mono',monospace;color:var(--muted);
    display:flex;justify-content:space-between;margin-bottom:5px}

  /* ---- scenarios ---- */
  .scen{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;
    padding:12px 0;border-top:1px solid var(--rule)}
  .scen:first-of-type{border-top:0}
  .scen b{font:600 15px Inter,sans-serif;display:block}
  .scen p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
  .odds{font:500 13px 'IBM Plex Mono',monospace;color:var(--ink);white-space:nowrap}
  .summary{margin:16px 0 0;padding:14px 16px;background:#F4F6F9;
    border-radius:8px;font-size:14.5px;border-left:3px solid var(--indigo)}

  /* ---- for / against ---- */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  @media(max-width:640px){.cols{grid-template-columns:1fr}
    .row{grid-template-columns:1fr}}
  ul{margin:0;padding-left:18px;font-size:14px}
  li{margin-bottom:7px}
  .cols h4{font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;
    text-transform:uppercase;margin:0 0 10px}
  .for h4{color:var(--pos)} .against h4{color:var(--neg)}

  ol.steps{padding-left:20px;font-size:15px;margin:0}
  ol.steps li{margin-bottom:9px}

  .foot{font-size:13px;color:var(--muted)}
  .foot table{width:100%;border-collapse:collapse;margin-top:6px}
  .foot td{padding:5px 0;border-top:1px solid var(--rule);
    font-family:'IBM Plex Mono',monospace;font-size:12px}
  .foot td:last-child{text-align:right}
  .warn{background:#FBF4E7;border:1px solid #E8D4AC;color:#6E4E12;
    padding:12px 16px;border-radius:8px;font-size:14px;margin-bottom:16px}
  .err{background:#FBEDEC;border:1px solid #E6C2BE;color:#7A2F28}
  .hidden{display:none}
  .skel{color:var(--muted);text-align:center;padding:48px 0;font-size:15px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---- v3.10 shell ---- */
  nav.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--rule);
    border-radius:var(--r);padding:4px;margin-bottom:20px}
  nav.tabs button{flex:1;background:transparent;color:var(--muted);border:0;
    font:600 15px Inter,'Noto Sans HK',sans-serif;padding:11px 8px}
  nav.tabs button:hover{background:#F2F5F8}
  nav.tabs button[aria-selected=true]{background:var(--indigo);color:#fff}
  .panel{display:none} .panel.on{display:block}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
  .filters label{display:block;font:500 12px 'Noto Sans HK',sans-serif;color:var(--muted);margin-bottom:4px}
  .filters select,.filters input[type=search]{width:100%;text-transform:none;font-family:Inter,'Noto Sans HK',sans-serif;letter-spacing:0}
  .check{display:flex;gap:8px;align-items:center;font-size:14px;padding:10px 0}
  .check input{width:auto}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
  .stat{flex:1 1 140px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px}
  .stat b{display:block;font:700 22px Archivo,sans-serif}
  .stat span{display:block;font-size:12.5px;line-height:1.4;color:var(--muted)}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th{text-align:left;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.06em;
    color:var(--muted);text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--rule)}
  .tbl td{padding:10px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
  .tbl tbody tr{cursor:pointer} .tbl tbody tr:hover{background:#F4F6F9}
  .tbl .n{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;white-space:nowrap}
  .tk{font:600 14px 'IBM Plex Mono',monospace}
  .nm{display:block;font-size:12.5px;color:var(--muted);max-width:28ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .flag{display:inline-block;font:500 11px 'Noto Sans HK',sans-serif;background:#FBEDEC;color:#7A2F28;
    border:1px solid #E6C2BE;border-radius:20px;padding:1px 8px;margin-top:3px}
  .scroll{overflow-x:auto;margin:0 -4px}
  .more{margin:14px auto 0;display:block}
  .ghost{background:var(--card);color:var(--indigo);border-color:var(--rule)}
  .ghost:hover{background:#F2F5F8}
  code{font:500 13px 'IBM Plex Mono',monospace;background:#F2F5F8;padding:2px 6px;border-radius:5px}
  .muted{color:var(--muted)}
  footer.links{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
  footer.links a{color:var(--muted)}
  @media(max-width:640px){.hide-sm{display:none}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>投資決策引擎<small>Investment decision engine · v3.10</small></h1>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="screen" aria-selected="true">① 篩選全市場</button>
  <button role="tab" data-tab="stock" aria-selected="false">② 查個股</button>
  <button role="tab" data-tab="track" aria-selected="false">③ 追蹤成績</button>
</nav>

<!-- ================= ① SCREEN ================= -->
<section id="p-screen" class="panel on">
  <div id="screen-status" class="stats"></div>
  <div class="card">
    <div class="filters">
      <div><label for="f-sector">行業</label><select id="f-sector"><option value="">全部行業</option></select></div>
      <div><label for="f-order">排序</label>
        <select id="f-order">
          <option value="sector_percentile">行業內排名（建議）</option>
          <option value="valuation">估值</option>
          <option value="fundamentals">基本面</option>
          <option value="score">總分</option>
          <option value="dollar_volume">成交額</option>
        </select></div>
      <div><label for="f-pct">行業內排名</label>
        <select id="f-pct">
          <option value="">不限</option>
          <option value="50">前 50%</option>
          <option value="75" selected>前 25%</option>
          <option value="90">前 10%</option>
        </select></div>
      <div><label for="f-q">搜尋</label><input id="f-q" type="search" placeholder="代號或公司名"></div>
    </div>
    <label class="check"><input type="checkbox" id="f-flags" checked> 排除過去一年有 8-K 警號嘅公司（核數師更換、財報重列、資產減值、除牌通知、破產）</label>
    <p id="screen-count" class="sub"></p>
  </div>
  <div id="screen-msg"></div>
  <div class="card" id="screen-card" style="display:none">
    <div class="scroll"><table class="tbl">
      <thead><tr><th>股票</th><th class="hide-sm">行業</th><th class="n">股價</th>
        <th class="n">行業內</th><th class="n">估值</th><th class="n hide-sm">基本面</th><th class="n">總分</th></tr></thead>
      <tbody id="screen-rows"></tbody>
    </table></div>
    <button id="screen-more" class="ghost more">載入更多</button>
  </div>
  <p class="sub">撳任何一行就會喺「查個股」做詳細分析。排名只係幫你搵未聽過嘅公司，<strong>唔係預測</strong>：個總分喺 15 年回測入面量度過，預測能力等於零。</p>
</section>

<!-- ================= ② STOCK ================= -->
<section id="p-stock" class="panel">
  <div class="card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <input id="ticker" placeholder="AAPL" aria-label="股票代號" autocomplete="off">
    <button id="go">分析</button>
    <span class="sub">持有期固定為約 3 個月，同向前測試一致。查詢唔會記入追蹤紀錄。</span>
  </div>
  <div id="msg"></div>
  <div id="out" class="hidden"></div>
  <div id="skel" class="skel">輸入股票代號，然後撳「分析」。</div>
</section>

<!-- ================= ③ TRACK ================= -->
<section id="p-track" class="panel">
  <div id="track-stats" class="stats"></div>
  <div id="track-body"></div>
</section>

<footer class="links">
  進階：<a href="/research">回測研究</a> · <a href="/docs">API 文件</a>
</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const BAND = {strong:'var(--pos)', mild:'var(--pos)', neutral:'var(--caut)',
               mild_weak:'var(--neg)', weak:'var(--neg)', unknown:'var(--none)'};
const esc = s => String(s??'').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v, d=0) => v==null ? '—' : Number(v).toFixed(d);
const pct = v => v==null ? '—' : (v>0?'+':'') + Number(v).toFixed(2) + '%';
const money = v => v==null ? '—' : v>=1e9 ? (v/1e9).toFixed(1)+'B' : (v/1e6).toFixed(0)+'M';
const day = s => s ? String(s).slice(0,10) : '—';
async function getJSON(url){ const r = await fetch(url); const d = await r.json();
  if(!r.ok) throw new Error(d.detail || r.statusText); return d; }

// ---------------- tabs ----------------
function show(tab){
  document.querySelectorAll('nav.tabs button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id==='p-'+tab));
  if(tab==='track' && !trackLoaded) loadTrack();
  try{ localStorage.setItem('tab', tab); }catch(e){}
}
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => show(b.dataset.tab));

// ---------------- ① screen ----------------
let offset = 0; const PAGE = 50;
async function loadScreenStatus(){
  try{
    const s = await getJSON('/api/v1/screen/status');
    if(s.status==='never_run'){
      $('#screen-status').innerHTML = '';
      $('#screen-msg').innerHTML = `<div class="warn"><strong>未做過全市場篩選。</strong><br>
        喺項目資料夾執行：<br><code>python scripts\\screen_universe.py --all --log-forward</code><br>
        第一次大約 1–3 個鐘（SEC 同 Yahoo 免費數據，唔使用 Alpha Vantage 額度）。之後每星期由排程自動行。</div>`;
      return false;
    }
    const sel = $('#f-sector');
    if(sel.options.length<=1) (s.sectors||[]).forEach(x => sel.add(new Option(x, x)));
    $('#screen-status').innerHTML = `
      <div class="stat"><b>${day(s.as_of_date)}</b><span>最近一次篩選${s.status==='finished'?'':'（未完成）'}</span></div>
      <div class="stat"><b>${(s.attempted||0).toLocaleString()}</b><span>檢查咗嘅美股</span></div>
      <div class="stat"><b>${(s.scored||0).toLocaleString()}</b><span>流動性足夠、有評分</span></div>
      <div class="stat"><b>${(s.illiquid||0).toLocaleString()}</b><span>成交太少或股價低於 $3，已剔除</span></div>`;
    return true;
  }catch(e){ $('#screen-msg').innerHTML = `<div class="warn err">${esc(e.message)}</div>`; return false; }
}
async function loadScreen(reset=true){
  if(reset){ offset = 0; $('#screen-rows').innerHTML=''; }
  const p = new URLSearchParams({limit:PAGE, offset, order:$('#f-order').value,
    exclude_red_flags:$('#f-flags').checked});
  if($('#f-sector').value) p.set('sector', $('#f-sector').value);
  if($('#f-pct').value) p.set('min_sector_percentile', $('#f-pct').value);
  if($('#f-q').value.trim()) p.set('q', $('#f-q').value.trim());
  try{
    const d = await getJSON('/api/v1/screen?'+p);
    if(d.status!=='ok'){ $('#screen-card').style.display='none'; return; }
    $('#screen-card').style.display='';
    const f = d.filtering;
    $('#screen-count').innerHTML = `符合條件：<strong>${f.matched.toLocaleString()}</strong> 間（總共評分 ${f.scored.toLocaleString()} 間；
      ${f.excluded_missing_critical.toLocaleString()} 間因為冇估值數據而唔排名）`;
    $('#screen-rows').insertAdjacentHTML('beforeend', d.results.map(r => `
      <tr data-t="${esc(r.ticker)}">
        <td><span class="tk">${esc(r.ticker)}</span><span class="nm">${esc(r.name||'')}</span>
          ${r.red_flag_count?`<span class="flag" title="${esc(r.red_flags_text)}">⚠ ${r.red_flag_count} 個警號</span>`:''}</td>
        <td class="hide-sm muted">${esc((r.sector||'').toLowerCase())}</td>
        <td class="n">${num(r.price,2)}</td>
        <td class="n">${r.sector_percentile==null?'—':'前 '+Math.max(1,Math.round(100-r.sector_percentile))+'%'}</td>
        <td class="n">${num(r.valuation)}</td>
        <td class="n hide-sm">${num(r.fundamentals)}</td>
        <td class="n">${num(r.score,1)}</td>
      </tr>`).join(''));
    offset += d.results.length;
    $('#screen-more').style.display = offset < f.matched ? '' : 'none';
  }catch(e){ $('#screen-msg').innerHTML = `<div class="warn err">${esc(e.message)}</div>`; }
}
['#f-sector','#f-order','#f-pct','#f-flags'].forEach(s => $(s).addEventListener('change', () => loadScreen()));
let qTimer; $('#f-q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(loadScreen, 300); });
$('#screen-more').onclick = () => loadScreen(false);
$('#screen-rows').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-t]'); if(!tr) return;
  $('#ticker').value = tr.dataset.t; show('stock'); run();
});

// ---------------- ② stock ----------------
async function run(){
  const t = $('#ticker').value.trim().toUpperCase();
  if(!t) return;
  $('#go').disabled = true;
  $('#msg').innerHTML = '';
  $('#out').classList.add('hidden');
  $('#skel').classList.remove('hidden');
  $('#skel').textContent = '攞緊股價、財報、8-K 公告同新聞…';
  try{
    const d = await getJSON(`/api/v1/stocks/${encodeURIComponent(t)}/analyze?horizon_days=63&log=false`);
    render(d);
  }catch(e){
    $('#skel').classList.add('hidden');
    $('#msg').innerHTML = `<div class="warn err"><strong>分析唔到。</strong><br>${esc(e.message)}</div>`;
  }finally{ $('#go').disabled = false; }
}
function render(d){
  const p = d.plain, w = d.weights_used || {}, parts = d.score_breakdown || {};
  const all = p.components;

  // ---- signature: evidence rail. Segment width = how much that measure counted.
  const known = all.filter(c => c.score !== null);
  const totalW = known.reduce((s,c) => s + (w[c.key]||0), 0) || 1;
  const missingShare = 1 - (d.coverage ?? 0);
  let rail = known.map(c => {
    const pct = ((w[c.key]||0)/totalW) * (d.coverage ?? 1) * 100;
    return `<div class="seg" style="width:${pct}%;background:${BAND[c.band]}"
      title="${esc(c.label)} — ${c.score}/100, ${Math.round(pct)}% of the result">
      <span>${pct > 9 ? esc(c.label) : ''}</span></div>`;
  }).join('');
  if(missingShare > 0.005){
    rail += `<div class="seg missing" style="width:${missingShare*100}%"
      title="Not measured"><span>${missingShare>0.12?'not measured':''}</span></div>`;
  }

  const missing = all.filter(c => c.score === null).map(c => c.label);
  const railNote = missing.length
    ? `Each block is one measure, sized by how much it counted. We could not measure <strong>${esc(missing.join(', '))}</strong>, so ${Math.round(missingShare*100)}% of the picture is blank.`
    : `Each block is one measure, sized by how much it counted toward the result. Everything we look for was available.`;

  const rows = all.map(c => `
    <div class="row">
      <div><h3>${esc(c.label)}</h3><p>${esc(c.question)} — ${esc(c.meaning)}</p>
        ${(c.detail&&c.detail.length)?`<p class="subs">${c.detail.map(s=>
          `<span><i style="background:${BAND[s.band]}"></i>${esc(s.label)} <b>${
            s.score===null?'no data':s.score.toFixed(0)}</b></span>`).join('')}</p>`:''}
      </div>
      <div>
        <div class="val"><span>${esc(c.verdict)}</span><span>${c.score===null?'—':c.score.toFixed(0)}</span></div>
        <div class="meter ${c.score===null?'na':''}">
          ${c.score===null?'':`<i data-w="${c.score}" style="background:${BAND[c.band]}"></i>`}
        </div>
      </div>
    </div>`).join('');

  const sc = p.scenarios;
  const scenHtml = sc ? `
    <div class="card">
      <p class="eyebrow">未來可能點走 · ${esc(sc.horizon)}</p>
      ${sc.rows.map(r => `<div class="scen">
          <div><b>${esc(r.title)}</b><p>${esc(r.sentence)}</p></div>
          <div class="odds">${r.odds_pct}%</div>
        </div>`).join('')}
      <div class="summary">${esc(sc.summary)}</div>
      ${sc.fx_note?`<p class="sub" style="margin-top:12px">${esc(sc.fx_note)}</p>`:''}
      <p class="sub" style="margin-top:12px">Odds shown are the engine's rough guess, not a measured
      frequency. The size of each move comes from how much this share price has actually
      been bouncing around.</p>
    </div>` : `<div class="card"><p class="eyebrow">未來可能點走</p>
      <p class="sub">${esc(d.scenario_note || 'Not enough price history to estimate outcomes.')}</p></div>`;

  const dq = d.data_quality || {};
  $('#out').innerHTML = `
    <div class="card">
      <p class="eyebrow">${esc(d.name || d.ticker)} · ${esc(d.ticker)}${d.price?` · ${d.price.toFixed(2)}`:''}</p>
      <p class="verdict tone-${esc(p.tone)}">${esc(p.action)}</p>
      <p class="lede">${esc(p.headline)}</p>
      <p class="sub"><strong>可信程度：</strong> ${esc(p.confidence_sentence)}</p>
    </div>

    <div class="card">
      <p class="eyebrow">結果由咩組成</p>
      <div class="rail">${rail}</div>
      <p class="rail-note">${railNote}</p>
      <p class="legend">
        <span><i style="background:var(--pos)"></i>supports buying</span>
        <span><i style="background:var(--caut)"></i>neutral</span>
        <span><i style="background:var(--neg)"></i>argues against</span>
        <span><i class="seg missing" style="background:repeating-linear-gradient(135deg,#E4E8ED 0 4px,#CFD6DE 4px 8px)"></i>not measured</span>
      </p>
    </div>

    <div class="card"><p class="eyebrow">檢查咗嘅八樣嘢</p>${rows}</div>

    ${scenHtml}

    <div class="card cols">
      <div class="for"><h4>支持</h4><ul>${
        (d.reasons_for||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="against"><h4>反對</h4><ul>${
        (d.reasons_against||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    </div>

    <div class="card">
      <p class="eyebrow">點樣用呢個結果</p>
      <ol class="steps">${p.what_to_do.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    </div>

    <div class="card foot">
      <p class="eyebrow">數據來源</p>
      <table>
        <tr><td>Price history</td><td>${esc(dq.price_source||'—')} · ${dq.price_observations||0} days${dq.price_adjusted===false?' · NOT split-adjusted':''}</td></tr>
        <tr><td>Company figures</td><td>${dq.fundamentals_ok?'Alpha Vantage':'unavailable'}</td></tr>
        <tr><td>Company accounts (SEC filings)</td><td>${dq.filings_ok
          ?`point-in-time · newest filing ${dq.filing_lag_days} days old`:'unavailable'}</td></tr>
        <tr><td>Macro conditions</td><td>${dq.macro_ok?'FRED':'unavailable — no FRED key'}</td></tr>
        <tr><td>News</td><td>${dq.news_ok?`${dq.news_articles} articles · ${dq.news_unique_events} distinct stories`:'unavailable'}</td></tr>
        <tr><td>Market &amp; industry</td><td>${dq.market_regime_ok?'available':'unavailable'} / ${dq.sector_regime_ok?'available':'unavailable'}</td></tr>
        <tr><td>Checked against real outcomes</td><td>no — see /api/v1/calibration/report</td></tr>
      </table>
      ${dq.price_warning?`<div class="warn" style="margin-top:14px">${esc(dq.price_warning)}</div>`:''}
      <p style="margin-top:14px">${esc(p.caveat)}</p>
    </div>`;

  $('#skel').classList.add('hidden');
  $('#out').classList.remove('hidden');
  requestAnimationFrame(() =>
    document.querySelectorAll('.meter i').forEach((el,i) =>
      setTimeout(() => el.style.width = el.dataset.w + '%', 40*i)));
}


$('#go').addEventListener('click', run);
$('#ticker').addEventListener('keydown', e => e.key === 'Enter' && run());

// ---------------- ③ track ----------------
let trackLoaded = false;
const ACTION_ZH = {BUY:'買入',ACCUMULATE:'分段買入',WATCH:'觀察',HOLD:'持有',REDUCE:'減持',
  AVOID:'避開','NO ACTION':'唔行動','INSUFFICIENT DATA':'數據不足',UNRATED:'未評級'};
const COMP_ZH = {valuation:'估值',fundamentals:'基本面',growth:'增長',technical:'技術走勢',
  money_flow:'資金流',news:'新聞',market:'大市',sector:'行業'};
async function loadTrack(){
  trackLoaded = true;
  try{
    const [s, r] = await Promise.all([getJSON('/api/v1/calibration/status'),
                                      getJSON('/api/v1/calibration/report')]);
    const src = s.by_source||{};
    $('#track-stats').innerHTML = `
      <div class="stat"><b>${(s.logged||0).toLocaleString()}</b><span>已記錄判斷（全市場 ${(src.screen||0).toLocaleString()} · watchlist ${(src.watchlist||0).toLocaleString()}）</span></div>
      <div class="stat"><b>${(s.resolved||0).toLocaleString()}</b><span>已到期、已計結果</span></div>
      <div class="stat"><b>${(s.due_now||0).toLocaleString()}</b><span>而家可以結算</span></div>
      <div class="stat"><b>${day(s.next_due)}</b><span>下一批到期日</span></div>`;
    if(r.status!=='ok'){
      $('#track-body').innerHTML = `<div class="card"><p class="eyebrow">未有結果</p>
        <p class="sub">第一批判斷要大約三個月先到期。排程每星期六會自動結算到期嘅判斷，你唔使做任何嘢。</p>
        <p class="sub" style="margin-top:10px"><strong>趁未見到結果，先寫低你嘅規則：</strong>如果 6 個月後「買入／分段買入」平均跑唔贏 SPY，
        而且向前 IC 唔係明顯大過零，就唔好跟呢啲標籤落注。</p></div>`;
      return;
    }
    const acts = Object.entries(r.by_action||{}).sort((a,b)=>b[1].n-a[1].n);
    const ic = r.forward_rank_ic||{}, comp = r.forward_component_ic||{};
    const compRows = comp.note ? `<p class="sub">${esc(comp.note)}</p>` :
      `<table class="tbl"><thead><tr><th>成分</th><th class="n">平均 IC</th><th class="n">t 值</th><th class="n">星期數</th></tr></thead><tbody>${
        Object.entries(comp).sort((a,b)=>(b[1].mean_ic||0)-(a[1].mean_ic||0)).map(([k,v]) =>
        `<tr><td>${esc(COMP_ZH[k]||k)}</td><td class="n">${num(v.mean_ic,4)}</td><td class="n">${num(v.t_stat,2)}</td><td class="n">${v.weeks}</td></tr>`).join('')}</tbody></table>
       <p class="sub" style="margin-top:10px">要 t 值大過 2.64 先算有效。估值係最值得留意嘅一項：回測入面每個時期都係正數，但從來未夠顯著。</p>`;
    $('#track-body').innerHTML = `
      <div class="card"><p class="eyebrow">按建議動作 · 對比同期 SPY</p>
        <div class="scroll"><table class="tbl"><thead><tr><th>動作</th><th class="n">數量</th><th class="n">平均回報</th>
          <th class="n">對比 SPY</th><th class="n">跑贏 SPY 比率</th></tr></thead><tbody>${
          acts.map(([a,b]) => `<tr><td>${esc(ACTION_ZH[a]||a)}</td><td class="n">${b.n}</td><td class="n">${pct(b.mean_return_pct)}</td>
            <td class="n">${pct(b.mean_excess_vs_benchmark_pct)}</td><td class="n">${b.beat_benchmark_rate==null?'—':Math.round(b.beat_benchmark_rate*100)+'%'}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="sub" style="margin-top:10px">「買入」同「分段買入」如果跑唔贏 SPY，就唔值得跟住做。</p></div>
      <div class="card"><p class="eyebrow">向前排名 IC · 分數高嘅股票係咪真係表現好啲？</p>
        ${ic.weeks ? `<p class="lede">平均 IC <strong>${num(ic.mean_ic,4)}</strong>，${ic.weeks} 個星期${ic.t_stat!=null?`，t 值 ${num(ic.t_stat,2)}`:''}</p>
          <p class="sub">回測結果：${esc(ic.backtest_reference)}。接近 0 即係冇預測能力。</p>`
          : `<p class="sub">${esc(ic.note||'數據未夠')}</p>`}</div>
      <div class="card"><p class="eyebrow">逐個成分嘅向前 IC</p>${compRows}</div>
      <p class="sub">樣本：${r.sample_size.toLocaleString()} 個判斷，${r.distinct_tickers.toLocaleString()} 間公司。少過幾百個唔好當係證據。</p>`;
  }catch(e){ $('#track-body').innerHTML = `<div class="warn err">${esc(e.message)}</div>`; }
}

// ---------------- boot ----------------
loadScreenStatus().then(ok => ok && loadScreen());
try{ const t = localStorage.getItem('tab'); if(t && t!=='screen') show(t); }catch(e){}
</script>
</body>
</html>
