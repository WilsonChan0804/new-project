site_name: HK Building Regulations Knowledge Base 香港建築法規知識庫
site_description: Bilingual summaries and explanations of the Buildings Ordinance, regulations, Codes of Practice and PNAPs
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link        # choosing "中文" on one page switches every page
    - content.code.copy
    - toc.follow
  palette:
    scheme: default
    primary: custom
    accent: custom
  font: false
  icon:
    logo: material/office-building

extra_css:
  - stylesheets/lwk.css

plugins:
  - search:
      # 'ja' loads Material's built-in CJK segmenter, which makes Traditional
      # Chinese queries (e.g. 樓面面積寬免) work without extra packages.
      lang: [en, ja]
      separator: '[\s\u200b\-_,:!=\[\]()"`/，。、；：「」（）]+'
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.keys

