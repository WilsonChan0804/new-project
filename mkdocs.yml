site_name: HK Building Regulations Knowledge Base 香港建築法規知識庫
site_description: Bilingual summaries and explanations of the Buildings Ordinance, regulations, Codes of Practice and PNAPs
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link        # choosing "中文" on one page switches every page
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    logo: material/office-building

plugins:
  - search:
      # 'ja' loads Material's built-in CJK segmenter, which makes Traditional
      # Chinese queries (e.g. 樓面面積寬免) work without extra packages.
      lang: [en, ja]
      separator: '[\s\u200b\-_,:!=\[\]()"`/，。、；：「」（）]+'
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.keys

nav:
  - Home 主頁: index.md
  - How to use 使用說明: how-to-use.md
  - PNAP & JPN 作業備考:
      - pnap/index.md
      - APP-2 GFA calculation 總樓面面積計算: pnap/app-2.md
      - APP-19 Projections 伸出物: pnap/app-19.md
      - APP-42 Amenity features 適意設施: pnap/app-42.md
      - APP-151 GFA concessions 樓面面積寬免: pnap/app-151.md
      - APP-152 SBD Guidelines 可持續建築設計指引: pnap/app-152.md
      - APP-156 Energy efficiency 能源效益: pnap/app-156.md
      - JPN 1 Green features 環保設施: pnap/jpn-1.md
      - JPN 2 Green features II 第二批環保設施: pnap/jpn-2.md
  - Ordinance & Regulations 條例及規例:
      - regulations/index.md
      - B(P)R 18A–22 SC & PR 上蓋面積及地積比率: regulations/bpr-18a-22.md
      - B(P)R 23 & 23A GFA 總樓面面積: regulations/bpr-23-23a.md
  - Codes of Practice 作業守則:
      - codes/index.md
      - FS Code 2011 消防安全守則: codes/fire-safety-code-2011.md
      - FS Code Part B Means of escape 逃生途徑: codes/fsc-part-b-means-of-escape.md
      - BFA 2008 暢通無阻的通道: codes/bfa-2008.md
  - Glossary 詞彙: glossary.md
  - Tags 標籤: tags.md
  - Contributing 編寫指引: contributing.md
