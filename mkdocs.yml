site_name: HK Building Regulations Knowledge Base 香港建築法規知識庫
site_description: Bilingual summaries and explanations of the Buildings Ordinance, regulations, Codes of Practice and PNAPs
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link        # choosing "中文" on one page switches every page
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Light mode 淺色
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode 深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Follow system 跟隨系統
  font: false
  icon:
    logo: material/office-building

hooks:
  - hooks/autolink.py

extra_javascript:
  - javascripts/kb-viewer-backend.js
  - javascripts/kb.js
  - javascripts/kb-pins.js

extra_css:
  - stylesheets/lwk.css

plugins:
  - search:
      # 'ja' loads Material's built-in CJK segmenter, which makes Traditional
      # Chinese queries (e.g. 樓面面積寬免) work without extra packages.
      lang: [en, ja]
      separator: '[\s\u200b\-_,:!=\[\]()"`/，。、；：「」（）]+'
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

