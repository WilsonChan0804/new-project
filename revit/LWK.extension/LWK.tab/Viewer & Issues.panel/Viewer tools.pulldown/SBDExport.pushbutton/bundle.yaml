title: |-
  SBD
  Export
tooltip: >-
  SBD (PNAP APP-152) from 3D: sends the model's Mass elements, the site boundary and the streets (Floors of a 'Street' type, kerb to kerb: their centreline, far side and level) to the LWK Viewer, which works out
  the permeability (P), separating distances (S1/S2/S3) and air corridors for the Low, Middle and High zones - see
  Checks > SBD on the 3D page.
author: Wilson Chan
