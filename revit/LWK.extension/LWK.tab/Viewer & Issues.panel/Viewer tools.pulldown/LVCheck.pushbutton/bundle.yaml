title: |-
  Light &
  Vent
tooltip: >-
  Lighting and ventilation of a typical floor: each UFA room's required and provided lighting and openable window area, from its windows and curtain panels. Saves a table (CSV/JSON) like the window calculation sheet, and - on request - a window area schedule plus a program-drawn schematic diagram of every window/curtain-wall run, as one PDF.
author: Wilson Chan
